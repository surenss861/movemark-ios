name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "movemark-android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "movemark-android/**"
      - ".github/workflows/android-ci.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movemark-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default ("tools platform-tools") asks for the legacy
          # SDK `tools` package, which current sdkmanager no longer serves.
          packages: platform-tools

      - name: Prepare local.properties for compile
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          NEON_AUTH_URL=https://ci.invalid/neondb/auth
          NEON_DATA_API_URL=https://ci.invalid/neondb/rest/v1
          MOVEMARK_API_BASE_URL=https://ci.invalid
          BILLING_MODE=mock
          EOF

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      # Release packaging needs the Play upload key (never in CI); compile the release variant instead.
      - name: Compile release
        run: ./gradlew compileReleaseKotlin --no-daemon
