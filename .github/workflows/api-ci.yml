name: API CI

on:
  push:
    branches: [main]
    paths:
      - "movemark-api/**"
      - ".github/workflows/api-ci.yml"
      - "railway.toml"
  pull_request:
    paths:
      - "movemark-api/**"
      - ".github/workflows/api-ci.yml"
      - "railway.toml"

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movemark-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: movemark-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Docker build
        run: docker build -t movemark-api:ci .
