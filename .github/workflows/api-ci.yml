name: API CI

on:
  push:
    branches: [main]
    paths:
      - "movemark-api/**"
      - ".github/workflows/api-ci.yml"
      - "railway.toml"
  pull_request:
    paths:
      - "movemark-api/**"
      - ".github/workflows/api-ci.yml"
      - "railway.toml"

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movemark-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: movemark-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: movemark-api
          push: false
          tags: movemark-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
