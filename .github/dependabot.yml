version: 2
updates:
  - package-ecosystem: npm
    directory: /movemark-api
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /movemark-android
    schedule:
      interval: weekly
    groups:
      gradle-dependencies:
        patterns:
          - "*"

  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
